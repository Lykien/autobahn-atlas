name: Deactivate public map
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-shutdown
  cancel-in-progress: false
jobs:
  shutdown:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: shutdown
      - uses: actions/deploy-pages@v4
        id: deployment
